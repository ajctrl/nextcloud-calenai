name: Publish image
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
defaults:
  run:
    shell: bash
concurrency:
  # Keep the same group as runs started before support expanded beyond 35.
  group: publish-nextcloud-35
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B .github/scripts/test-plan-images.py
  releases:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.find.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - name: Identify missing builds and tags
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/plan-images.py >> "$GITHUB_OUTPUT"
  publish:
    needs: releases
    if: needs.releases.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.releases.outputs.jobs) }}
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: ${{ matrix.base == 'apache' && 'compose.apache.yaml' || 'compose.yaml' }}
      IMAGE_TAG: ${{ matrix.revision }}
      SERVER: ${{ matrix.base == 'apache' && 'apache2-foreground' || 'php-fpm' }}
      NEXTCLOUD_VARIANT: ${{ matrix.base }}
      NEXTCLOUD_MAJOR: ${{ matrix.major }}
      NEXTCLOUD_IMAGE: ${{ matrix.source }}
      CALENAI_SHA256: ${{ matrix.checksum }}
      GH_TOKEN: ${{ github.token }}
      CALENAI_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Confirm revision is current on retry
        id: current
        if: github.run_attempt != '1'
        run: |
          latest_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest_commit" != "$GITHUB_SHA" ]]; then
            echo "wanted=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wanted=$(python3 .github/scripts/plan-images.py --check "$NEXTCLOUD_MAJOR" "$NEXTCLOUD_VARIANT" "$IMAGE_TAG")
          echo "wanted=$wanted" >> "$GITHUB_OUTPUT"
      - name: Build, test and publish revision
        if: matrix.build && steps.current.outputs.wanted != '[]'
        run: |
          image=$(docker compose config --images app)
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            if docker manifest inspect "$image" >/dev/null 2>manifest-error; then exit 0; fi
            if ! grep -Eiq 'manifest unknown|name unknown|no such manifest' manifest-error; then
              cat manifest-error >&2
              exit 1
            fi
          fi
          docker buildx build --load --platform linux/amd64 --build-arg NEXTCLOUD_IMAGE --build-arg CALENAI_VERSION --build-arg CALENAI_SHA256 -t "$image" .
          # Finish setup after the server starts and wait for the first-use hook.
          docker compose -p fresh up -d
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/status.php |
            jq -e '.installed == false'
          docker compose -p fresh exec -T -u www-data app php occ maintenance:install --database sqlite --admin-user admin --admin-pass test-only
          for attempt in {1..30}; do
            if docker compose -p fresh exec -T -u www-data app php occ app:list --output=json | jq -e '.enabled | has("calenai")'; then break; fi
            if (( attempt == 30 )); then docker compose -p fresh logs app; exit 1; fi
            sleep 2
          done
          docker compose -p fresh down -v
          # Install upstream Nextcloud first, then migrate its volume to this image.
          docker compose create app
          docker run --rm --volumes-from "$(docker compose ps -aq app)" -e NEXTCLOUD_ADMIN_USER=admin -e NEXTCLOUD_ADMIN_PASSWORD=test-only -e SQLITE_DATABASE=nextcloud "$NEXTCLOUD_IMAGE" "$SERVER" -t
          docker compose run --rm --no-deps app "$SERVER" -t
          docker compose run --rm --no-deps -u www-data app php occ app:list --output=json | jq -e '.enabled | has("calenai")'
          docker compose run --rm --no-deps -u www-data app php occ app:disable calenai
          docker compose up -d
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/status.php |
            jq -e '.installed == true and .maintenance == false and .needsDbUpgrade == false'
          docker compose exec -T -u www-data app php occ app:list --output=json | jq -e '.disabled | has("calenai")'
          # Older images have no initialization record. Preserve their explicit disable.
          docker compose exec -T -u www-data app php occ config:app:delete core calenai_image_initialized
          docker compose run --rm --no-deps app "$SERVER" -t
          docker compose exec -T -u www-data app php occ app:list --output=json | jq -e '.disabled | has("calenai")'
          docker compose exec -T -u www-data app php occ config:app:get core calenai_image_initialized | grep -Fx yes
          docker push "$image"
      - name: Publish version and rolling aliases
        if: steps.current.outputs.wanted != '[]'
        run: |
          wanted=$(python3 .github/scripts/plan-images.py --check "$NEXTCLOUD_MAJOR" "$NEXTCLOUD_VARIANT" "$IMAGE_TAG")
          if [[ "$wanted" == "[]" ]]; then exit 0; fi
          image=$(docker compose config --images app)
          tags=()
          while read -r alias; do
            tags+=(-t "${image%:*}:$alias")
          done < <(jq -r '.[]' <<< "$wanted")
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$image"
  cleanup:
    needs: [tests, publish]
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove package versions belonging exclusively to EOL majors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/plan-images.py --cleanup
