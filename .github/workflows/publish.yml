name: Publish image
on:
  push:
    tags: ['35-calenai-*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test
        run: |
          image=$(docker compose config --images | grep '^ghcr.io/')
          docker buildx build --load -t "$image" .
          docker compose run --rm --no-deps -e NEXTCLOUD_ADMIN_USER=admin -e NEXTCLOUD_ADMIN_PASSWORD=test-only -e SQLITE_DATABASE=nextcloud app php-fpm -t
          docker compose run --rm --no-deps -u www-data app php occ app:enable calenai
          docker compose up -d
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/status.php | jq -e '.installed == true'
          docker push "$image"
