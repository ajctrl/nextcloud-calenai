services:
  app:
    image: ghcr.io/ajctrl/nextcloud-calenai:${IMAGE_TAG:-35-fpm-alpine}
    volumes:
      - nextcloud:/var/www/html
  web:
    image: nginx:stable-alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - nextcloud:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  nextcloud:
